<!doctype html><html><head><meta charset="utf-8"><title>Office avatar review</title><style>body{margin:0;background:#7c8780;font:14px system-ui;color:#f4f2e8}header{position:fixed;left:36px;top:24px}h1{font-size:25px;font-weight:500;margin:0 0 8px}.labels{position:fixed;bottom:35px;width:100%;display:flex;justify-content:space-around;letter-spacing:2px}canvas{display:block}</style></head><body><header><h1>TinkerSpace · Office avatar</h1><span>One reusable rig · separate shirt material · five embedded animation clips</span></header><div class="labels"><span>FRONT</span><span>THREE QUARTER</span><span>WALK</span><span>SEATED</span></div><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {clone} from 'three/addons/utils/SkeletonUtils.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#7c8780');const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,40);camera.position.set(0,2.8,7.5);camera.lookAt(0,1,0);
scene.add(new THREE.HemisphereLight('#ffffff','#404839',2.5));const sun=new THREE.DirectionalLight('#fff1dc',3);sun.position.set(-3,6,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:'#7c8780',roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const asset=await new GLTFLoader().loadAsync('/models/office-avatar.glb'),models=[];
for(const [i,clip]of ['Idle','Idle','Walk','SittingIdle'].entries()){const g=clone(asset.scene);g.position.x=(i-1.5)*1.22;g.rotation.y=[0,.65,.8,.35][i];g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}});scene.add(g);const mixer=new THREE.AnimationMixer(g);mixer.clipAction(asset.animations.find(c=>c.name===clip)).play();mixer.update(clip==='Walk'?.2:0);models.push({g,mixer});}
// A neutral seat proves the 46 cm seating fit without exporting a chair in GLB.
const mat=new THREE.MeshStandardMaterial({color:'#303b35'});for(const [size,pos]of [[[.49,.045,.46],[1.83,.46,0]],[[.47,.48,.035],[1.83,.735,-.22]]]){const mesh=new THREE.Mesh(new THREE.BoxGeometry(...size),mat);mesh.position.set(...pos);scene.add(mesh)}
window.review={scene,camera,renderer,models,asset};renderer.setAnimationLoop(()=>renderer.render(scene,camera));window.ready=true;
</script></body></html>
